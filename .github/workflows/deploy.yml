name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"] # ตั้งค่าให้รันอัตโนมัติเมื่อมีการ push ขึ้นกิ่ง main

  # อนุญาตให้กดรันเองได้จากหน้าเว็บ GitHub (แถบ Actions)
  workflow_dispatch:

# กำหนดสิทธิ์ในการเข้าถึงและอัปเดต GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกันไม่ให้มีการ deploy ซ้อนทับกันพร้อมๆ กัน
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # โฟลเดอร์ที่ได้จากการ build ของ Vite

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
